<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Support Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #chat { width: 100%; max-width: 600px; }
        #chat div { margin-bottom: 10px; }
        #chat .user { font-weight: bold; }
    </style>
</head>
<body>
<h1>User Support Chatbot</h1>
<div id="chat"></div>
<input id="q" type="text" style="width: 80%;" placeholder="Ask a question" />
<button onclick="send()">Send</button>
<script>
async function send() {
    const input = document.getElementById('q');
    const question = input.value;
    if (!question) return;
    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class='user'>You: ${question}</div>`;
    const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
    });
    const data = await res.json();
    chat.innerHTML += `<div class='bot'>Bot: ${data.answer}</div>`;
    input.value = '';
}
</script>
</body>
</html>
